<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 450px;
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .register-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input.valid {
            border-color: #28a745;
            background: #f8fff9;
        }

        .form-group input.invalid {
            border-color: #dc3545;
            background: #fff8f8;
        }

        .validation-requirements {
            margin-top: 8px;
            font-size: 12px;
        }

        .requirement-item {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
            padding: 2px 0;
        }

        .requirement-icon {
            margin-right: 6px;
            font-size: 10px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .requirement-icon.valid {
            background: #28a745;
            color: white;
        }

        .requirement-icon.invalid {
            background: #dc3545;
            color: white;
        }

        .requirement-icon.neutral {
            background: #6c757d;
            color: white;
        }

        .requirement-text {
            color: #333;
        }

        .requirement-text.valid {
            color: #28a745;
        }

        .requirement-text.invalid {
            color: #dc3545;
        }

        .captcha-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .captcha-container input {
            flex: 1;
        }

        .captcha-display {
            background: #f0f0f0;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            padding: 8px 15px;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            letter-spacing: 2px;
            user-select: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .captcha-display:hover {
            background: #e9ecef;
        }

        .password-strength {
            margin-top: 5px;
            font-size: 12px;
        }

        .strength-bar {
            height: 4px;
            border-radius: 2px;
            margin-top: 5px;
            transition: all 0.3s ease;
        }

        .strength-weak { background: #dc3545; width: 25%; }
        .strength-fair { background: #ffc107; width: 50%; }
        .strength-good { background: #17a2b8; width: 75%; }
        .strength-strong { background: #28a745; width: 100%; }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .validation-icon {
            position: absolute;
            right: 15px;
            top: 38px;
            font-size: 16px;
            display: none;
        }

        .validation-icon.valid {
            color: #28a745;
            display: block;
        }

        .validation-icon.invalid {
            color: #dc3545;
            display: block;
        }

        @media (max-width: 480px) {
            .register-container {
                padding: 30px 20px;
                margin: 10px;
            }
            
            .captcha-container {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <h1>用户注册</h1>
            <p>创建您的账户，开始精彩旅程</p>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="以字母开头，6-10位字符">
                <span class="validation-icon" id="usernameIcon"></span>
                <div class="validation-requirements" id="usernameRequirements"></div>
            </div>

            <div class="form-group">
                <label for="email">电子邮箱</label>
                <input type="email" id="email" name="email" placeholder="请输入您的邮箱地址">
                <span class="validation-icon" id="emailIcon"></span>
                <div class="validation-requirements" id="emailRequirements"></div>
            </div>

            <div class="form-group">
                <label for="phone">手机号码</label>
                <input type="tel" id="phone" name="phone" placeholder="请输入11位手机号码">
                <span class="validation-icon" id="phoneIcon"></span>
                <div class="validation-requirements" id="phoneRequirements"></div>
            </div>

            <div class="form-group">
                <label for="idCard">身份证号</label>
                <input type="text" id="idCard" name="idCard" placeholder="请输入18位身份证号码">
                <span class="validation-icon" id="idCardIcon"></span>
                <div class="validation-requirements" id="idCardRequirements"></div>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请设置强密码">
                <span class="validation-icon" id="passwordIcon"></span>
                <div class="password-strength">
                    <div class="strength-text" id="strengthText"></div>
                    <div class="strength-bar" id="strengthBar"></div>
                </div>
                <div class="validation-requirements" id="passwordRequirements"></div>
            </div>

            <div class="form-group">
                <label for="captcha">验证码</label>
                <div class="captcha-container">
                    <input type="text" id="captcha" name="captcha" placeholder="请输入6位数字验证码">
                    <div class="captcha-display" id="captchaDisplay" onclick="generateCaptcha()"></div>
                </div>
                <span class="validation-icon" id="captchaIcon"></span>
                <div class="validation-requirements" id="captchaRequirements"></div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn" disabled>立即注册</button>
        </form>
    </div>

    <script>
        // 验证要求定义
        const validationRules = {
            username: [
                { test: value => /^[a-zA-Z]/.test(value), text: '必须以字母开头' },
                { test: value => /^[a-zA-Z][a-zA-Z0-9_]*$/.test(value), text: '只能包含字母、数字、下划线' },
                { test: value => value.length >= 6, text: '长度至少6位' },
                { test: value => value.length <= 10, text: '长度不超过10位' }
            ],
            email: [
                { test: value => value.includes('@'), text: '必须包含@符号' },
                { test: value => /^[a-zA-Z0-9._%+-]+@/.test(value), text: '@前必须是有效的用户名' },
                { test: value => /@[a-zA-Z0-9.-]+\./.test(value), text: '必须有有效的域名' },
                { test: value => /\.[a-zA-Z]{2,}$/.test(value), text: '必须有有效的顶级域名' }
            ],
            phone: [
                { test: value => /^1/.test(value), text: '必须以1开头' },
                { test: value => /^1[3-9]/.test(value), text: '第二位必须是3-9' },
                { test: value => /^\d+$/.test(value), text: '必须全部为数字' },
                { test: value => value.length === 11, text: '必须是11位数字' }
            ],
            idCard: [
                { test: value => /^[1-9]/.test(value), text: '首位不能为0' },
                { test: value => /^\d{17}[\dXx]$/.test(value), text: '必须是18位，最后一位可以是X' },
                { test: value => /^\d{6}(18|19|20)\d{2}/.test(value), text: '出生年份必须合理(1800-2099)' },
                { test: value => /\d{6}(18|19|20)\d{2}((0[1-9])|(1[0-2]))/.test(value), text: '月份必须合理(01-12)' },
                { test: value => /\d{6}(18|19|20)\d{2}((0[1-9])|(1[0-2]))(([0-2][1-9])|10|20|30|31)/.test(value), text: '日期必须合理(01-31)' }
            ],
            password: [
                { test: value => value.length >= 8, text: '长度至少8位' },
                { test: value => /[a-z]/.test(value), text: '必须包含小写字母' },
                { test: value => /[A-Z]/.test(value), text: '必须包含大写字母' },
                { test: value => /\d/.test(value), text: '必须包含数字' },
                { test: value => /[@$!%*?&]/.test(value), text: '必须包含特殊字符(@$!%*?&)' }
            ],
            captcha: [
                { test: value => /^\d+$/.test(value), text: '必须全部为数字' },
                { test: value => value.length === 6, text: '必须是6位数字' },
                { test: value => value === currentCaptcha, text: '验证码必须正确' }
            ]
        };

        let currentCaptcha = '';
        let validationState = {
            username: false,
            email: false,
            phone: false,
            idCard: false,
            password: false,
            captcha: false
        };

        // 生成验证码
        function generateCaptcha() {
            currentCaptcha = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById('captchaDisplay').textContent = currentCaptcha;
            validateField('captcha'); // 重新验证验证码字段
        }

        // 创建要求项目HTML
        function createRequirementItem(requirement, isValid, value) {
            const iconClass = !value ? 'neutral' : (isValid ? 'valid' : 'invalid');
            const textClass = !value ? '' : (isValid ? 'valid' : 'invalid');
            const iconText = !value ? '•' : (isValid ? '✓' : '✗');
            
            return `
                <div class="requirement-item">
                    <span class="requirement-icon ${iconClass}">${iconText}</span>
                    <span class="requirement-text ${textClass}">${requirement.text}</span>
                </div>
            `;
        }

        // 验证字段
        function validateField(fieldName) {
            const field = document.getElementById(fieldName);
            const value = field.value.trim();
            const requirementsElement = document.getElementById(fieldName + 'Requirements');
            const iconElement = document.getElementById(fieldName + 'Icon');

            const rules = validationRules[fieldName];
            if (!rules) return false;

            let allValid = true;
            let requirementsHTML = '';

            // 检查每个验证规则
            rules.forEach(rule => {
                const isValid = value ? rule.test(value) : false;
                if (!isValid && value) allValid = false;
                requirementsHTML += createRequirementItem(rule, isValid, value);
            });

            // 如果值为空，所有规则都未通过
            if (!value) allValid = false;

            // 更新UI
            field.className = allValid && value ? 'valid' : (value ? 'invalid' : '');
            
            if (requirementsElement) {
                requirementsElement.innerHTML = requirementsHTML;
            }
            
            if (iconElement) {
                iconElement.className = allValid && value ? 'validation-icon valid' : (value ? 'validation-icon invalid' : 'validation-icon');
                iconElement.textContent = allValid && value ? '✓' : (value ? '✗' : '');
            }

            // 特殊处理密码强度
            if (fieldName === 'password') {
                updatePasswordStrength(getPasswordStrength(value));
            }

            validationState[fieldName] = allValid && value;
            updateSubmitButton();
            
            return allValid && value;
        }

        // 获取密码强度
        function getPasswordStrength(password) {
            if (!password) return 0;
            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[@$!%*?&]/.test(password)) strength++;
            return Math.min(strength, 4);
        }

        // 更新密码强度显示
        function updatePasswordStrength(strength) {
            const strengthText = document.getElementById('strengthText');
            const strengthBar = document.getElementById('strengthBar');
            
            const strengthTexts = ['', '弱', '一般', '良好', '强'];
            const strengthClasses = ['', 'strength-weak', 'strength-fair', 'strength-good', 'strength-strong'];
            
            strengthText.textContent = strength > 0 ? `密码强度: ${strengthTexts[strength]}` : '';
            strengthBar.className = strength > 0 ? `strength-bar ${strengthClasses[strength]}` : 'strength-bar';
        }

        // 更新提交按钮状态
        function updateSubmitButton() {
            const submitBtn = document.getElementById('submitBtn');
            const allValid = Object.values(validationState).every(state => state);
            submitBtn.disabled = !allValid;
        }

        // 添加事件监听器
        document.addEventListener('DOMContentLoaded', function() {
            // 生成初始验证码
            generateCaptcha();

            // 为所有输入字段添加事件监听器
            const fields = ['username', 'email', 'phone', 'idCard', 'password', 'captcha'];
            
            fields.forEach(fieldName => {
                const field = document.getElementById(fieldName);
                
                // 初始化显示要求
                validateField(fieldName);
                
                field.addEventListener('input', function() {
                    validateField(fieldName);
                });
                
                field.addEventListener('blur', function() {
                    validateField(fieldName);
                });
            });

            // 表单提交事件
            document.getElementById('registerForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                // 验证所有字段
                let allValid = true;
                fields.forEach(fieldName => {
                    if (!validateField(fieldName)) {
                        allValid = false;
                    }
                });
                
                if (allValid) {
                    alert('注册成功！所有信息验证通过。');
                    // 这里可以添加实际的注册逻辑
                } else {
                    alert('请检查并修正表单中的错误信息。');
                }
            });
        });
    </script>
</body>
</html>
